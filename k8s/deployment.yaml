apiVersion: apps/v1
kind: Deployment

metadata:
  name: meditrriage-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: meditrriage-api

  template:
    metadata:
      labels:
        app: meditrriage-api

    spec:
      containers:
      - name: api

        image: ghcr.io/djat03/meditrriage-api:v1

        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
            name: meditrriage-config

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"
