apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-image-signature
  annotations:
    policies.kyverno.io/title: Secure Image Verification
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: High
    policies.kyverno.io/description: >-
      Valida que las imágenes de contenedor desplegadas en el clúster
      estén firmadas mediante Cosign Keyless usando la identidad de GitHub Actions.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/djat03/equipo-a-meditriage-triage-*"
          attestations: []
          verifyDigest: true
          required: true
          mutateDigest: true
          type: Cosign
          version: v1
          certMinter: "https://githubusercontent.com"
