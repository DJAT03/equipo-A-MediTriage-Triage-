extends: ["spectral:oas"]
rules:
  meditriage-path-versioned:
    description: Toda ruta debe empezar con /api/vN/
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions: { match: "^/api/v[0-9]+/" }

  meditriage-operation-description:
    description: Cada operacion necesita description
    severity: error
    given: "$.paths[*][get,post,put,patch,delete]"
    then: { field: description, function: truthy }

  meditriage-operation-id-camelcase:
    description: operationId en camelCase
    severity: error
    given: "$.paths[*][*].operationId"
    then:
      function: casing
      functionOptions: { type: camel }

  meditriage-errors-rfc7807:
    description: Las respuestas 4xx y 5xx deben usar application/problem+json
    severity: warn
    given: "$.paths[*][*].responses[?(@property >= 400)].content"
    then: { field: application/problem+json, function: truthy }
