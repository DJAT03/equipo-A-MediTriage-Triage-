name: security
on: [pull_request]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Escaneo SAST con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/owasp-top-ten .semgrep/"

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo SCA con Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # 0 significa "solo avisa, no bloquees"
          ignore-unfixed: 'true'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Escaneo de secretos en historial
        uses: gitleaks/gitleaks-action@v2

  sbom:
    name: SBOM CycloneDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: workflows
        run: npm install
      - name: Generar SBOM CycloneDX
        working-directory: workflows
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: workflows/sbom.json
