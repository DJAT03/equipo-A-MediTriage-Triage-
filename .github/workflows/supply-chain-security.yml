name: S10 - Supply Chain Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov - Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar si existen archivos Terraform
        id: terraform
        shell: bash
        run: |
          if find . -type f -name '*.tf' -not -path './.git/*' -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se encontraron archivos .tf. Checkov no puede realizar el escaneo Terraform hasta que el equipo incorpore la infraestructura como código."
          fi

      - name: Instalar Checkov
        if: steps.terraform.outputs.exists == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false

  build-and-sign:
    name: Build, push and sign image with Cosign Keyless
    if: github.event_name != 'pull_request' && hashFiles('Dockerfile') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/djat03/meditrriage-api:${{ github.sha }}

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Firmar imagen con identidad OIDC (Keyless)
        env:
          IMAGE: ghcr.io/djat03/meditrriage-api
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verificar firma publicada
        env:
          IMAGE: ghcr.io/djat03/meditrriage-api
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain-security.yml@refs/heads/main" \
            "${IMAGE}@${DIGEST}"

  missing-dockerfile:
    name: Aviso - falta Dockerfile
    if: github.event_name != 'pull_request' && hashFiles('Dockerfile') == ''
    runs-on: ubuntu-latest
    steps:
      - name: Informar bloqueo de construcción
        run: |
          echo "::warning::No existe Dockerfile en la raíz. El job de Cosign se omite porque primero debe existir una imagen construible."
          echo "Añadir y validar Dockerfile antes de considerar completa la firma de imágenes."
