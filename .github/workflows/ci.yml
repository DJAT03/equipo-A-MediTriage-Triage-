name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar Jest
        run: npm test

      - name: Ejecutar SAST con Semgrep
        uses: returntocorp/semgrep-action@v1

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build y Push a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/djat03/meditrriage-api:${{ github.sha }}

  promote:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo GitOps
        uses: actions/checkout@v4
        with:
          repository: DJAT03/equipo-a-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Actualizar newTag y subir cambios
        run: |
          cd gitops
          
          # Actualizar el tag en los environments
          sed -i "s/newTag:.*/newTag: ${{ github.sha }}/g" overlays/dev/kustomization.yaml
          sed -i "s/newTag:.*/newTag: ${{ github.sha }}/g" overlays/prod/kustomization.yaml
          
          # Subir los cambios al repositorio de infraestructura
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "ci: actualiza tag de imagen a ${{ github.sha }}"
          git push
